<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163044">
  <meta name="description" content="서울대 도서관과 평택시립 배다리도서관에서 빌릴 책을 고르는 서재.">
  <title>읽고 싶은 책 아카이브</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/library_bg.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="ground" aria-hidden="true">
    <svg class="grain" width="100%" height="100%">
      <filter id="papergrain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.22  0 0 0 0 0.26  0 0 0 0.22 0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#papergrain)"/>
    </svg>
  </div>

  <div class="shop">
    <header class="mast">
      <h1>
        <span class="l1">읽고 싶은 책</span>
        <span class="l2">아카이브</span>
      </h1>
    </header>

    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M16 16.2 20 20.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="제목이나 저자" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="cats" id="classes" role="toolbar" aria-label="한국십진분류"></div>
      <div class="tool-row">
        <div class="seg sorts" role="radiogroup" aria-label="정렬">
          <button type="button" role="radio" data-sort="call" aria-checked="true">청구기호</button>
          <button type="button" role="radio" data-sort="loan" aria-checked="false">대출</button>
        </div>
        <div class="seg libs" role="radiogroup" aria-label="도서관">
          <button type="button" role="radio" data-lib="snu" aria-checked="false">서울대</button>
          <button type="button" role="radio" data-lib="pt" aria-checked="false">배다리</button>
          <button type="button" role="radio" data-lib="both" aria-checked="true">둘 다</button>
        </div>
        <button type="button" class="stamp" id="only" aria-pressed="false">대출가능만</button>
      </div>
    </div>

    <p class="sr" id="count" aria-live="polite"></p>

    <main class="case">
      <div id="shelves"></div>
    </main>
  </div>

  <dialog id="detail">
    <div class="sheet">
      <article class="card">
        <button type="button" class="close" id="close">닫기</button>
        <div class="grab" aria-hidden="true"></div>
        <div class="cover-wrap" id="cover"></div>
        <p class="cat" id="d-cat"></p>
        <p class="callno" id="d-call" hidden></p>
        <h2 id="d-title"></h2>
        <p class="author" id="d-author"></p>
        <p class="blurb" id="d-blurb" hidden></p>
        <div class="slip" id="slip"></div>
        <div class="links" id="links"></div>
        <button type="button" class="cycle" id="cycle">
          <span data-v="want">읽고 싶음</span>
          <span data-v="maybe">후보</span>
          <span data-v="read">읽음</span>
        </button>
      </article>
    </div>
  </dialog>

  <script src="js/archive.js" defer></script>
</body>
</html>
