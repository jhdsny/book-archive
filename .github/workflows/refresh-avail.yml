name: Refresh availability

on:
  schedule:
    # 13:00 UTC = 22:00 KST. GitHub may start the run a little later.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-avail
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh library availability
        run: python3 scripts/refresh.py

      - name: Commit availability and call numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/avail.json data/books.json
          if git diff --cached --quiet; then
            echo "availability and call numbers unchanged"
          else
            git commit -m "Update library availability and KDC call numbers"
            git push
          fi
