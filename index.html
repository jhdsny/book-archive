<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24170f">
  <meta name="description" content="서울대 도서관과 평택시립 배다리도서관에서 빌릴 책을 고르는 서재.">
  <title>읽고 싶은 책 아카이브</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="shop">
    <header class="hero">
      <div class="scene">
        <svg viewBox="0 0 640 440" aria-hidden="true">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fbf6e8"/>
              <stop offset="0.28" stop-color="#e7f0d6"/>
              <stop offset="0.62" stop-color="#b9ce96"/>
              <stop offset="1" stop-color="#6f9456"/>
            </linearGradient>
            <radialGradient id="sun" cx="70%" cy="16%" r="58%">
              <stop offset="0" stop-color="#fffaf0"/>
              <stop offset="0.28" stop-color="#fff3d4" stop-opacity=".95"/>
              <stop offset="0.62" stop-color="#f6e2ae" stop-opacity=".45"/>
              <stop offset="1" stop-color="#f6e2ae" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffaf0" stop-opacity=".18"/>
              <stop offset=".55" stop-color="#f4f1e4" stop-opacity=".32"/>
              <stop offset="1" stop-color="#e4ecd4" stop-opacity=".42"/>
            </linearGradient>
            <radialGradient id="insetShade" cx="50%" cy="42%" r="68%">
              <stop offset=".58" stop-color="#1a120c" stop-opacity="0"/>
              <stop offset="1" stop-color="#1a120c" stop-opacity=".32"/>
            </radialGradient>
            <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f3eee4"/>
              <stop offset=".45" stop-color="#ddd4c6"/>
              <stop offset="1" stop-color="#b7ad9e"/>
            </linearGradient>
            <linearGradient id="mullionV" x1="0" x2="1">
              <stop offset="0" stop-color="#8d857a"/>
              <stop offset=".28" stop-color="#f4efe6"/>
              <stop offset=".7" stop-color="#d5cdc0"/>
              <stop offset="1" stop-color="#756d62"/>
            </linearGradient>
            <linearGradient id="mullionH" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f7f3ea"/>
              <stop offset=".45" stop-color="#d9d1c4"/>
              <stop offset="1" stop-color="#8a8276"/>
            </linearGradient>
            <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f7f3ea"/>
              <stop offset=".18" stop-color="#e4dcd0"/>
              <stop offset=".55" stop-color="#b7ad9e"/>
              <stop offset="1" stop-color="#6e675e"/>
            </linearGradient>
            <pattern id="grain" width="7" height="80" patternUnits="userSpaceOnUse">
              <path d="M1 0 V80 M4 0 V80" stroke="#3a281c" stroke-width=".6" opacity=".55"/>
              <path d="M2.4 0 V80" stroke="#120c09" stroke-width=".8" opacity=".35"/>
            </pattern>
            <clipPath id="panes">
              <rect x="78" y="36" width="233" height="142"/>
              <rect x="329" y="36" width="233" height="142"/>
              <rect x="78" y="194" width="233" height="142"/>
              <rect x="329" y="194" width="233" height="142"/>
            </clipPath>
            <filter id="bokeh" x="-25%" y="-25%" width="150%" height="150%">
              <feGaussianBlur stdDeviation="11"/>
            </filter>
            <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
              <feGaussianBlur stdDeviation="2.6"/>
            </filter>
            <filter id="dust" x="0" y="0" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
              <feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .22 0"/>
            </filter>
          </defs>

          <rect width="640" height="440" fill="#24170f"/>
          <rect width="640" height="440" fill="url(#grain)"/>

          <g clip-path="url(#panes)">
            <rect x="70" y="30" width="500" height="320" fill="url(#sky)"/>
            <rect x="70" y="30" width="500" height="320" fill="url(#sun)"/>
            <g filter="url(#bokeh)">
              <ellipse cx="120" cy="70" rx="90" ry="54" fill="#3f6a38"/>
              <ellipse cx="230" cy="120" rx="120" ry="70" fill="#6e9a52"/>
              <ellipse cx="160" cy="200" rx="140" ry="80" fill="#2f5530"/>
              <ellipse cx="300" cy="250" rx="150" ry="70" fill="#4f7c40"/>
              <ellipse cx="470" cy="230" rx="130" ry="78" fill="#2c4e2c"/>
              <ellipse cx="520" cy="120" rx="100" ry="60" fill="#87ab68"/>
              <ellipse cx="400" cy="80" rx="70" ry="40" fill="#d5e2b4"/>
              <ellipse cx="90" cy="280" rx="80" ry="50" fill="#234428"/>
              <ellipse cx="560" cy="300" rx="90" ry="56" fill="#1d3a24"/>
              <ellipse cx="340" cy="40" rx="60" ry="28" fill="#f3f6df"/>
            </g>
            <g filter="url(#soft)" opacity=".85">
              <ellipse cx="150" cy="90" rx="46" ry="28" fill="#7eaa5c"/>
              <ellipse cx="250" cy="160" rx="54" ry="30" fill="#3e6938"/>
              <ellipse cx="430" cy="200" rx="60" ry="34" fill="#588848"/>
              <ellipse cx="500" cy="78" rx="36" ry="22" fill="#edf3d8"/>
              <ellipse cx="200" cy="250" rx="50" ry="26" fill="#2a4c2c"/>
              <ellipse cx="360" cy="300" rx="70" ry="28" fill="#446e3a"/>
            </g>
            <rect x="70" y="30" width="500" height="320" fill="url(#haze)"/>
            <path d="M430 36 H562 V150 L500 36 Z" fill="#fffaf0" opacity=".34"/>
            <path d="M78 36 H200 L78 120 Z" fill="#fffaf0" opacity=".12"/>
            <rect x="70" y="30" width="500" height="320" filter="url(#dust)"/>
            <rect x="70" y="30" width="500" height="320" fill="url(#insetShade)"/>
          </g>

          <path fill="url(#frame)" fill-rule="evenodd" d="M52 16 H588 V358 H52 Z M78 36 H562 V336 H78 Z"/>
          <path d="M54 17 H586" stroke="#fbf7f0" stroke-width="1.6" opacity=".8"/>
          <path d="M54 17 V356" stroke="#fbf7f0" stroke-width="1.2" opacity=".35"/>
          <rect x="311" y="36" width="18" height="300" fill="url(#mullionV)"/>
          <rect x="78" y="178" width="484" height="16" fill="url(#mullionH)"/>
          <path d="M311 36 H329" stroke="#6e675c" stroke-width="1" opacity=".45"/>
          <path d="M78 193 H562" stroke="#6e675c" stroke-width="1" opacity=".35"/>

          <g>
            <g transform="translate(62,286)">
              <rect width="112" height="15" fill="#2a1d14"/>
              <rect y="17" width="112" height="12" fill="#3c2a1c"/>
              <rect y="31" width="108" height="14" fill="#1a120e"/>
              <rect y="47" width="112" height="13" fill="#322318"/>
              <rect y="2" width="112" height="1" fill="#6a5340" opacity=".45"/>
              <rect y="19" width="112" height="1" fill="#6a5340" opacity=".35"/>
            </g>
            <g fill="#24180f">
              <rect x="188" y="286" width="20" height="70"/>
              <rect x="210" y="268" width="15" height="88"/>
              <rect x="227" y="292" width="24" height="64"/>
              <rect x="253" y="256" width="17" height="100"/>
              <rect x="272" y="274" width="20" height="82"/>
              <rect x="294" y="298" width="13" height="58"/>
              <rect x="309" y="262" width="22" height="94"/>
              <rect x="333" y="304" width="18" height="52"/>
              <rect x="353" y="270" width="26" height="86"/>
              <rect x="381" y="286" width="15" height="70"/>
              <rect x="398" y="250" width="20" height="106"/>
              <rect x="420" y="292" width="17" height="64"/>
              <rect x="439" y="266" width="24" height="90"/>
              <rect x="465" y="280" width="18" height="76"/>
              <rect x="485" y="300" width="16" height="56"/>
              <rect x="503" y="274" width="22" height="82"/>
            </g>
            <g fill="#5c4a38" opacity=".45">
              <rect x="192" y="304" width="8" height="26"/>
              <rect x="257" y="278" width="8" height="34"/>
              <rect x="314" y="286" width="9" height="30"/>
              <rect x="402" y="274" width="8" height="36"/>
              <rect x="470" y="300" width="8" height="24"/>
            </g>
            <g>
              <rect x="188" y="286" width="2" height="70" fill="#6d5844" opacity=".55"/>
              <rect x="253" y="256" width="2" height="100" fill="#6d5844" opacity=".5"/>
              <rect x="353" y="270" width="2" height="86" fill="#6d5844" opacity=".45"/>
              <rect x="439" y="266" width="2" height="90" fill="#6d5844" opacity=".5"/>
            </g>
            <g transform="translate(268,322)">
              <rect width="156" height="11" fill="#2c2018"/>
              <rect y="13" width="156" height="10" fill="#1a120e"/>
              <rect y="25" width="152" height="11" fill="#3a291c"/>
            </g>
          </g>

          <rect x="36" y="352" width="568" height="24" fill="url(#sill)"/>
          <rect x="36" y="352" width="568" height="3" fill="#fbf7f0" opacity=".9"/>
          <rect x="36" y="374" width="568" height="3" fill="#2a2118" opacity=".35"/>
          <ellipse cx="320" cy="402" rx="230" ry="22" fill="#ffd7a2" opacity=".14"/>
        </svg>
        <div class="motes" aria-hidden="true">
          <i style="left:30%;top:24%"></i>
          <i style="left:42%;top:18%;animation-delay:-2.4s"></i>
          <i style="left:54%;top:32%;animation-delay:-4s"></i>
          <i style="left:63%;top:16%;animation-delay:-1.2s"></i>
          <i style="left:48%;top:40%;animation-delay:-6s"></i>
          <i style="left:36%;top:28%;animation-delay:-3.3s"></i>
        </div>
      </div>
      <div class="beam" aria-hidden="true"></div>
      <h1>
        <span class="l1">읽고 싶은 책</span>
        <span class="l2">아카이브</span>
      </h1>
    </header>

    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M16 16.2 20 20.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="제목이나 저자" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="cats" role="toolbar" aria-label="분류">
        <button type="button" data-cat="all" aria-pressed="true">전체</button>
        <button type="button" data-cat="H" aria-pressed="false">인문·사회·AI</button>
        <button type="button" data-cat="W" aria-pressed="false">일·자기계발</button>
        <button type="button" data-cat="N" aria-pressed="false">소설·에세이·시</button>
      </div>
      <div class="tool-row">
        <div class="seg" role="radiogroup" aria-label="도서관">
          <button type="button" role="radio" data-lib="snu" aria-checked="false">서울대</button>
          <button type="button" role="radio" data-lib="pt" aria-checked="false">배다리</button>
          <button type="button" role="radio" data-lib="both" aria-checked="true">둘 다</button>
        </div>
        <label class="only">
          <input id="only" type="checkbox">
          <span>대출가능만</span>
        </label>
      </div>
    </div>

    <p class="sr" id="count" aria-live="polite"></p>

    <main class="case">
      <div class="cornice"></div>
      <div id="shelves"></div>
      <div class="plinth"></div>
    </main>
  </div>

  <dialog id="detail">
    <div class="sheet">
      <article class="card">
        <button type="button" class="close" id="close">닫기</button>
        <div class="grab" aria-hidden="true"></div>
        <div class="cover-wrap" id="cover"></div>
        <p class="cat" id="d-cat"></p>
        <h2 id="d-title"></h2>
        <p class="author" id="d-author"></p>
        <div class="slip" id="slip"></div>
        <div class="links" id="links"></div>
        <button type="button" class="cycle" id="cycle">
          <span data-v="want">읽고 싶음</span>
          <span data-v="maybe">후보</span>
          <span data-v="read">읽음</span>
        </button>
      </article>
    </div>
  </dialog>

  <script src="js/archive.js" defer></script>
</body>
</html>
